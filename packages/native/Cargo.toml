[package]
name = "patchwave-native"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrayvec = "=0.7.8"
cpal = "=0.18.1"
napi = "=3.10.5"
napi-derive = "=3.5.10"
rtrb = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[build-dependencies]
napi-build = "=2.3.2"

[profile.release]
lto = true
strip = "symbols"
panic = "abort"
